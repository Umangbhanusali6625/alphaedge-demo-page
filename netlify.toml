[build]
  publish = "."

# Custom Branded Auth Proxy (Shows 'alphaedgeproacademy.com' instead of firebaseapp.com)
[[redirects]]
  from = "/__/auth/*"
  to = "https://alphaedge-pro-a8181.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Block Sensitive Hidden Files & Internal Git Repos
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.vscode/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# Pretty URLs (e.g. /uop-theory serves /uop-theory.html)
[[redirects]]
  from = "/uop-theory"
  to = "/uop-theory.html"
  status = 200

[[redirects]]
  from = "/apa-theory"
  to = "/apa-theory.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/study-guides"
  to = "/study-guides.html"
  status = 200

# Global Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML pages - always fetch latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache assets, images, and fonts for high performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/theory-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 404 Catch-All Handler (Blocks directory listing and non-existent files)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
