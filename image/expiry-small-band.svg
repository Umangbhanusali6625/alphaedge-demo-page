<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Expiry small-band decision map for 22600 CE</title>
<desc id="desc">Illustration using the supplied 52 to 59 premium band. One path holds the band and rebounds. A separate path breaks below 52, may continue toward zero if the call finishes out of the money, and is invalidated when price reclaims the band. No probability is asserted.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071625"/><stop offset="1" stop-color="#0c2940"/></linearGradient><linearGradient id="band" x2="0" y2="1"><stop stop-color="#273d4d"/><stop offset="1" stop-color="#345453"/></linearGradient></defs>
<rect width="1100" height="650" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1098" height="648" rx="21" fill="none" stroke="#486374"/>
<g font-family="Arial,sans-serif">
<text x="42" y="54" fill="#f2bd66" font-size="17" font-weight="700" letter-spacing="3">ALPHAEDGE PRO ACADEMY · U.O.P THEORY</text>
<text x="42" y="96" fill="#f5f4ee" font-size="29" font-weight="700">22600 CE · Expiry small-band decision map</text>
<text x="42" y="126" fill="#a8bdc9" font-size="16">Premium points · 52–59 from supplied example · scenarios, not a replay of the chart</text>
<text x="50" y="211" fill="#d8e8eb" font-size="17" font-weight="700">ABOVE BAND</text><text x="50" y="244" fill="#d8e8eb" font-size="16">Premium can</text><text x="50" y="269" fill="#d8e8eb" font-size="16">remain active</text>
<line x1="260" x2="1020" y1="235" y2="235" stroke="#39596a" stroke-dasharray="5 8"/>
<rect x="258" y="304" width="765" height="76" rx="10" fill="url(#band)" stroke="#eec16e" stroke-width="2"/>
<text x="48" y="330" fill="#f4d18e" font-size="18" font-weight="700">UPPER EDGE</text><text x="1015" y="328" fill="#f4d18e" font-size="22" font-weight="700" text-anchor="end">59</text>
<text x="285" y="350" fill="#fff4d9" font-size="21" font-weight="700">SMALL BAND · DECISION ZONE</text>
<text x="48" y="384" fill="#f4d18e" font-size="18" font-weight="700">LOWER EDGE</text><text x="1015" y="406" fill="#f4d18e" font-size="22" font-weight="700" text-anchor="end">52</text>
<line x1="258" x2="1023" y1="380" y2="380" stroke="#eec16e" stroke-width="2"/>
<path d="M288 205 C350 220 391 289 451 316 S514 347 546 341 C585 334 631 290 672 244 S775 199 855 205" fill="none" stroke="#81d6a3" stroke-width="6" stroke-linecap="round"/>
<circle cx="546" cy="341" r="8" fill="#81d6a3"/><rect x="676" y="174" width="197" height="28" rx="6" fill="#1d463b"/><text x="690" y="194" fill="#bcf4cd" font-size="16" font-weight="700">A · Band holds → bounce</text>
<path d="M288 205 C356 221 406 287 455 320 S534 351 580 381 S640 416 667 428 C723 452 786 483 864 540" fill="none" stroke="#f19b90" stroke-width="6" stroke-linecap="round"/>
<circle cx="667" cy="428" r="8" fill="#f19b90"/><path d="M864 540 L930 573" fill="none" stroke="#f19b90" stroke-width="5" stroke-dasharray="9 9" stroke-linecap="round"/>
<rect x="671" y="433" width="293" height="29" rx="6" fill="#493337"/><text x="684" y="454" fill="#ffbeb5" font-size="16" font-weight="700">B · Below 52 → decay watch</text>
<path d="M673 428 C730 394 764 362 815 342" fill="none" stroke="#f2bd66" stroke-width="2" stroke-dasharray="7 6"/>
<text x="818" y="339" fill="#f6d08d" font-size="15">Reclaim = reassess / exit plan</text>
<text x="45" y="517" fill="#b8cbd3" font-size="16">A break is a signal to verify, not a guarantee of zero.</text>
<text x="45" y="547" fill="#b8cbd3" font-size="16">Zero intrinsic value requires final NIFTY settlement at or below 22,600 for this CE.</text>
<line x1="42" x2="1058" y1="600" y2="600" stroke="#486374"/>
<text x="42" y="631" fill="#9fbac7" font-size="15">Risk example: define entry, invalidation, position size and exit before a short-premium trade.</text>
</g></svg>
