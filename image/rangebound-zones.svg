<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Range-bound session: two possible premium reversals</title><desc id="desc">Two schematic premium paths. Upside premium may reject from Main Up TG 2. Downside premium may bounce or reverse near Main Down TG 2, and may sometimes continue to Main Down TG 3 as time value decays. Neither path is guaranteed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071625"/><stop offset="1" stop-color="#0c2940"/></linearGradient></defs><rect width="1100" height="620" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1098" height="618" rx="21" fill="none" stroke="#486374"/><g font-family="Arial,sans-serif"><text x="42" y="54" fill="#f2bd66" font-size="17" font-weight="700" letter-spacing="3">ALPHAEDGE PRO ACADEMY · U.O.P THEORY</text><text x="42" y="96" fill="#f5f4ee" font-size="29" font-weight="700">Range-bound session: two possible premium reversals</text><text x="42" y="126" fill="#a8bdc9" font-size="16">Alternative paths · no fixed prices implied</text></g>
<g font-family="Arial,sans-serif">
<rect x="42" y="160" width="1016" height="177" rx="14" fill="#173a39" stroke="#659e8d"/><text x="64" y="192" fill="#aeedc2" font-size="18" font-weight="700">A · UPSIDE PREMIUM REACHES MAIN UP TG 2</text><line x1="331" x2="1013" y1="224" y2="224" stroke="#83d5a0" stroke-width="2" stroke-dasharray="8 6"/><text x="66" y="230" fill="#c5ecd0" font-size="16" font-weight="700">MAIN UP TG 2</text><path d="M333 310 C452 302 480 275 559 248 S667 224 729 224 S797 250 846 285 S920 306 986 313" fill="none" stroke="#80daa4" stroke-width="6" stroke-linecap="round"/><circle cx="729" cy="224" r="7" fill="#ffc0a7"/><text x="774" y="318" fill="#ffc0a7" font-size="16">Possible rejection</text>
<rect x="42" y="354" width="1016" height="202" rx="14" fill="#362b38" stroke="#9c697b"/><text x="64" y="388" fill="#ffc1c8" font-size="18" font-weight="700">B · DOWNSIDE PREMIUM TESTS MAIN DOWN TG 2 / 3</text><line x1="331" x2="1013" y1="470" y2="470" stroke="#dc8792" stroke-width="2" stroke-dasharray="8 6"/><text x="64" y="476" fill="#ffd1d4" font-size="16" font-weight="700">MAIN DOWN TG 2</text><line x1="331" x2="1013" y1="516" y2="516" stroke="#dc8792" stroke-width="2" stroke-dasharray="8 6"/><text x="64" y="522" fill="#ffd1d4" font-size="16" font-weight="700">MAIN DOWN TG 3</text><path d="M334 420 C456 423 523 462 623 470 S717 444 766 423" fill="none" stroke="#f1a09b" stroke-width="5" stroke-linecap="round"/><path d="M623 470 C706 477 752 512 829 516 S905 488 982 475" fill="none" stroke="#f1a09b" stroke-width="5" stroke-dasharray="9 8" stroke-linecap="round"/><circle cx="623" cy="470" r="7" fill="#fff"/><circle cx="829" cy="516" r="7" fill="#fff"/><text x="788" y="446" fill="#ffc1c8" font-size="15">Solid: bounce at TG 2</text><text x="804" y="543" fill="#ffc1c8" font-size="15">Dashed: extension to TG 3</text>
<text x="42" y="595" fill="#b8cbd3" font-size="15">Watch actual price and TCL; time decay can pull a weekly premium lower even with a range-bound index.</text></g></svg>