<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a14"/>
      <stop offset="40%" stop-color="#071527"/>
      <stop offset="75%" stop-color="#091c34"/>
      <stop offset="100%" stop-color="#050d18"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="65%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="25%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#b45309" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="cyanWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="goldWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#f3c578" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="waveFillCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Candlestick Gradients -->
    <linearGradient id="bullGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="bullCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="accentGoldBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern: High-tech Trading Grid -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="60" cy="0" r="1" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>

    <pattern id="subGridPattern" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M 180 0 L 0 0 0 180" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.12"/>
      <circle cx="180" cy="0" r="2" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Fill -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Spheres -->
  <rect width="1920" height="1080" fill="url(#topGlow)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#goldGlow)"/>

  <!-- Isometric / Perspective Grid Overlay -->
  <g opacity="0.85">
    <rect width="1920" height="1080" fill="url(#gridPattern)"/>
    <rect width="1920" height="1080" fill="url(#subGridPattern)"/>
  </g>

  <!-- Perspective Floor Lines -->
  <g stroke="#0284c7" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="880" x2="1920" y2="880"/>
    <line x1="0" y1="940" x2="1920" y2="940"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
    <line x1="160" y1="1080" x2="480" y2="800" stroke-dasharray="4 6"/>
    <line x1="560" y1="1080" x2="720" y2="800" stroke-dasharray="4 6"/>
    <line x1="960" y1="1080" x2="960" y2="800" stroke-dasharray="4 6"/>
    <line x1="1360" y1="1080" x2="1200" y2="800" stroke-dasharray="4 6"/>
    <line x1="1760" y1="1080" x2="1440" y2="800" stroke-dasharray="4 6"/>
  </g>

  <!-- Floating Data Nodes / Constellation -->
  <g opacity="0.65" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 4">
    <line x1="280" y1="320" x2="420" y2="260"/>
    <line x1="420" y1="260" x2="580" y2="340"/>
    <line x1="580" y1="340" x2="780" y2="210"/>
    <line x1="780" y1="210" x2="980" y2="270"/>
    <line x1="980" y1="270" x2="1180" y2="160"/>
    <line x1="1180" y1="160" x2="1380" y2="240"/>
    <line x1="1380" y1="240" x2="1620" y2="150"/>
  </g>

  <g fill="#00f2fe">
    <circle cx="280" cy="320" r="3.5" filter="url(#softGlow)"/>
    <circle cx="420" cy="260" r="4" filter="url(#softGlow)"/>
    <circle cx="580" cy="340" r="3" filter="url(#softGlow)"/>
    <circle cx="780" cy="210" r="5" filter="url(#neonGlow)"/>
    <circle cx="980" cy="270" r="3.5" filter="url(#softGlow)"/>
    <circle cx="1180" cy="160" r="5" filter="url(#neonGlow)"/>
    <circle cx="1380" cy="240" r="4" filter="url(#softGlow)"/>
    <circle cx="1620" cy="150" r="5.5" filter="url(#neonGlow)"/>
  </g>

  <!-- Glowing Candlestick Cluster (Institutional Market Formation) -->
  <g opacity="0.78">
    <!-- Bar 1 -->
    <line x1="310" y1="620" x2="310" y2="720" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="303" y="645" width="14" height="50" rx="2" fill="url(#bullCyan)"/>

    <!-- Bar 2 -->
    <line x1="360" y1="590" x2="360" y2="700" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="353" y="610" width="14" height="65" rx="2" fill="url(#bullGreen)"/>

    <!-- Bar 3 -->
    <line x1="410" y1="560" x2="410" y2="670" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="403" y="580" width="14" height="60" rx="2" fill="url(#bullCyan)"/>

    <!-- Bar 4 (Breakout) -->
    <line x1="460" y1="510" x2="460" y2="640" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.9"/>
    <rect x="452" y="530" width="16" height="85" rx="2" fill="url(#accentGoldBar)" filter="url(#softGlow)"/>

    <!-- Bar 5 -->
    <line x1="510" y1="490" x2="510" y2="590" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/>
    <rect x="503" y="505" width="14" height="55" rx="2" fill="url(#bullCyan)"/>

    <!-- Bar 6 -->
    <line x1="560" y1="450" x2="560" y2="570" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.85"/>
    <rect x="553" y="470" width="14" height="70" rx="2" fill="url(#bullGreen)"/>

    <!-- Bar 7 -->
    <line x1="610" y1="420" x2="610" y2="530" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="603" y="440" width="14" height="60" rx="2" fill="url(#bullCyan)"/>

    <!-- Right Cluster: High Momentum Impulse Wave -->
    <line x1="1260" y1="480" x2="1260" y2="590" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="1253" y="500" width="14" height="60" rx="2" fill="url(#bullCyan)"/>

    <line x1="1310" y1="430" x2="1310" y2="550" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect x="1303" y="450" width="14" height="75" rx="2" fill="url(#bullGreen)"/>

    <line x1="1360" y1="380" x2="1360" y2="500" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.9"/>
    <rect x="1352" y="400" width="16" height="80" rx="2" fill="url(#accentGoldBar)" filter="url(#softGlow)"/>

    <line x1="1410" y1="340" x2="1410" y2="460" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.95"/>
    <rect x="1402" y="360" width="16" height="75" rx="2" fill="url(#bullCyan)" filter="url(#softGlow)"/>

    <line x1="1460" y1="310" x2="1460" y2="420" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.85"/>
    <rect x="1453" y="325" width="14" height="65" rx="2" fill="url(#bullGreen)"/>

    <line x1="1510" y1="260" x2="1510" y2="390" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.9"/>
    <rect x="1502" y="280" width="16" height="85" rx="2" fill="url(#bullCyan)" filter="url(#softGlow)"/>

    <line x1="1560" y1="220" x2="1560" y2="340" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.95"/>
    <rect x="1552" y="240" width="16" height="80" rx="2" fill="url(#accentGoldBar)" filter="url(#neonGlow)"/>
  </g>

  <!-- Volumetric Histogram / Volume Bars along Lower Section -->
  <g opacity="0.32" fill="#0284c7">
    <rect x="200" y="740" width="8" height="60" rx="1"/>
    <rect x="220" y="720" width="8" height="80" rx="1"/>
    <rect x="240" y="750" width="8" height="50" rx="1"/>
    <rect x="260" y="690" width="8" height="110" rx="1"/>
    <rect x="280" y="710" width="8" height="90" rx="1"/>
    <rect x="300" y="660" width="8" height="140" rx="1"/>
    <rect x="320" y="640" width="8" height="160" rx="1" fill="#00f2fe" opacity="0.6"/>
    <rect x="340" y="680" width="8" height="120" rx="1"/>
    <rect x="360" y="630" width="8" height="170" rx="1" fill="#10b981" opacity="0.6"/>
    <rect x="380" y="670" width="8" height="130" rx="1"/>
    <rect x="400" y="610" width="8" height="190" rx="1"/>
    <rect x="420" y="580" width="8" height="220" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="440" y="630" width="8" height="170" rx="1"/>
    <rect x="460" y="660" width="8" height="140" rx="1"/>
    <rect x="480" y="700" width="8" height="100" rx="1"/>
    <rect x="1200" y="710" width="8" height="90" rx="1"/>
    <rect x="1220" y="670" width="8" height="130" rx="1"/>
    <rect x="1240" y="640" width="8" height="160" rx="1"/>
    <rect x="1260" y="600" width="8" height="200" rx="1"/>
    <rect x="1280" y="560" width="8" height="240" rx="1" fill="#00f2fe" opacity="0.6"/>
    <rect x="1300" y="530" width="8" height="270" rx="1" fill="#f59e0b" opacity="0.6"/>
    <rect x="1320" y="570" width="8" height="230" rx="1"/>
    <rect x="1340" y="510" width="8" height="290" rx="1" fill="#10b981" opacity="0.6"/>
    <rect x="1360" y="480" width="8" height="320" rx="1" fill="#00f2fe" opacity="0.7"/>
    <rect x="1380" y="540" width="8" height="260" rx="1"/>
    <rect x="1400" y="510" width="8" height="290" rx="1"/>
    <rect x="1420" y="470" width="8" height="330" rx="1" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- Luminous Algorithmic Wave Curves (Exponential Flow) -->
  <!-- Wave Area Fill -->
  <path d="M 0 780 
           Q 280 840, 520 660 
           T 980 620 
           T 1420 380 
           T 1920 320 
           L 1920 1080 L 0 1080 Z" 
        fill="url(#waveFillCyan)"/>

  <!-- Secondary Ribbon Glow -->
  <path d="M 0 760 
           Q 320 810, 560 640 
           T 1020 600 
           T 1460 360 
           T 1920 290" 
        fill="none" 
        stroke="url(#goldWaveGrad)" 
        stroke-width="2.5" 
        filter="url(#neonGlow)"/>

  <!-- Primary Dynamic Algorithmic Curve -->
  <path d="M 0 740 
           Q 300 790, 540 620 
           T 1000 580 
           T 1440 340 
           T 1920 270" 
        fill="none" 
        stroke="url(#cyanWaveGrad)" 
        stroke-width="3.5" 
        filter="url(#neonGlow)"/>

  <!-- Tertiary Precision Hairline Stream -->
  <path d="M 0 710 
           Q 340 760, 580 600 
           T 1040 550 
           T 1480 320 
           T 1920 240" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.35" 
        stroke-width="1.2" 
        stroke-dasharray="10 6"/>

  <!-- High-Tech Data Callouts & Telemetry Badges -->
  <g font-family="'JetBrains Mono', 'DM Sans', monospace" font-size="11" letter-spacing="1.5">
    <!-- Callout 1 (Breakout Point) -->
    <g transform="translate(450, 480)" opacity="0.85">
      <rect x="-8" y="-18" width="115" height="26" rx="4" fill="#040e1d" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="4" cy="-5" r="3" fill="#f59e0b"/>
      <text x="14" y="-2" fill="#fbbf24" font-weight="600">ACCUMULATION</text>
    </g>

    <!-- Callout 2 (Trend Acceleration) -->
    <g transform="translate(1420, 290)" opacity="0.9">
      <rect x="-8" y="-18" width="125" height="26" rx="4" fill="#040e1d" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.85" filter="url(#softGlow)"/>
      <circle cx="4" cy="-5" r="3" fill="#00f2fe"/>
      <text x="14" y="-2" fill="#38bdf8" font-weight="700">U.O.P. EXPANSION</text>
    </g>
  </g>

  <!-- Ambient Light Orbs & Bokeh Particles -->
  <g opacity="0.8">
    <circle cx="460" cy="520" r="2.5" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="580" cy="460" r="2" fill="#00f2fe"/>
    <circle cx="890" cy="590" r="3" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="1060" cy="560" r="2" fill="#ffffff"/>
    <circle cx="1230" cy="480" r="2.5" fill="#f59e0b" filter="url(#softGlow)"/>
    <circle cx="1370" cy="390" r="3" fill="#00f2fe" filter="url(#softGlow)"/>
    <circle cx="1470" cy="330" r="2.5" fill="#ffffff"/>
    <circle cx="1640" cy="270" r="3" fill="#f59e0b" filter="url(#softGlow)"/>
    
    <!-- Subtle Starbursts -->
    <g transform="translate(1440, 340)" stroke="#00f2fe" stroke-width="1.2" opacity="0.75">
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    </g>

    <g transform="translate(460, 530)" stroke="#fbbf24" stroke-width="1" opacity="0.7">
      <line x1="-6" y1="0" x2="6" y2="0"/>
      <line x1="0" y1="-6" x2="0" y2="6"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
