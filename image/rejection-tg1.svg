<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">CE premium rejection from MAIN UP TG 1 at 291.00</title>
<desc id="desc">Teaching illustration. Premium rises above Side Up 3 with TCL confirmation, passes any earlier main targets, touches MAIN UP TG 1 at 291.00, then pulls back. The TCL is illustrative and a target touch does not confirm a reversal.</desc>
