<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">APA Scenario 2 bullish setup</title><desc id="desc">Weekly close above APA Peak; intraday low between APA Peak and SPT creates an alert; price crossing back above APA Peak opens APA UP1, UP2 and UP3 levels to observe.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a2b3a"/><stop offset="1" stop-color="#0b1b2b"/></linearGradient><marker id="up" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5bdfc9"/></marker></defs><rect width="720" height="430" rx="16" fill="url(#bg)"/><rect x="27" y="20" width="324" height="35" rx="17" fill="#0a776e"/><text x="44" y="43" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="bold">WEEKLY CLOSE ABOVE APA PEAK</text><rect x="35" y="243" width="520" height="108" rx="10" fill="#3fd4bb" opacity=".1"/><g stroke-width="2" stroke-dasharray="7 6"><path d="M35 100H552M35 143H552M35 186H552" stroke="#70d7c5"/><path d="M35 242H552" stroke="#f3c777"/><path d="M35 351H552" stroke="#6ab8ce"/></g><g fill="#e9f6f4" font-family="Arial,sans-serif" font-size="16" font-weight="bold"><text x="569" y="105">APA UP3</text><text x="569" y="148">APA UP2</text><text x="569" y="191">APA UP1</text><text x="569" y="247">APA PEAK</text><text x="569" y="356">APA SPT</text></g><path d="M88 202L145 221L204 266L253 308L294 285L341 254L390 231L426 198L465 168L500 130" fill="none" stroke="#5bdfc9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#up)"/><circle cx="253" cy="308" r="7" fill="#f3c777"/><circle cx="390" cy="231" r="7" fill="#5bdfc9"/><path d="M248 317L215 371H136" stroke="#f3c777" stroke-width="2" fill="none"/><text x="52" y="395" fill="#f8dfb2" font-family="Arial,sans-serif" font-size="15" font-weight="bold">LOW IN PEAK–SPT ZONE: ALERT</text><path d="M393 226L418 272H505" stroke="#5bdfc9" stroke-width="2" fill="none"/><text x="395" y="296" fill="#aff2e7" font-family="Arial,sans-serif" font-size="15" font-weight="bold">PEAK RE-CROSS: TRIGGER</text></svg>
