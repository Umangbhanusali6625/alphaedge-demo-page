<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">APA Scenario 2 bearish setup</title><desc id="desc">Weekly close below APA Trough; intraday high between APA Trough and SPT creates an alert; price moving back below APA Trough opens APA DN1, DN2 and DN3 levels to observe.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a2b3a"/><stop offset="1" stop-color="#0b1b2b"/></linearGradient><marker id="down" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f69d9a"/></marker></defs><rect width="720" height="430" rx="16" fill="url(#bg)"/><rect x="27" y="20" width="341" height="35" rx="17" fill="#a34751"/><text x="44" y="43" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="bold">WEEKLY CLOSE BELOW APA TROUGH</text><rect x="35" y="86" width="520" height="118" rx="10" fill="#f68f91" opacity=".1"/><g stroke-width="2" stroke-dasharray="7 6"><path d="M35 86H552" stroke="#6ab8ce"/><path d="M35 205H552" stroke="#f3c777"/><path d="M35 265H552M35 315H552M35 365H552" stroke="#f69d9a"/></g><g fill="#e9f6f4" font-family="Arial,sans-serif" font-size="16" font-weight="bold"><text x="569" y="91">APA SPT</text><text x="569" y="210">APA TROUGH</text><text x="569" y="270">APA DN1</text><text x="569" y="320">APA DN2</text><text x="569" y="370">APA DN3</text></g><path d="M87 266L144 241L201 192L249 135L297 164L344 187L391 215L437 257L478 310L504 347" fill="none" stroke="#f69d9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#down)"/><circle cx="249" cy="135" r="7" fill="#f3c777"/><circle cx="391" cy="215" r="7" fill="#f69d9a"/><path d="M245 127L214 65H125" stroke="#f3c777" stroke-width="2" fill="none"/><text x="50" y="78" fill="#f8dfb2" font-family="Arial,sans-serif" font-size="15" font-weight="bold">HIGH IN SPT–TROUGH ZONE: ALERT</text><path d="M394 222L412 378H483" stroke="#f69d9a" stroke-width="2" fill="none"/><text x="339" y="403" fill="#ffcecb" font-family="Arial,sans-serif" font-size="15" font-weight="bold">TROUGH RE-BREAK: TRIGGER</text></svg>
