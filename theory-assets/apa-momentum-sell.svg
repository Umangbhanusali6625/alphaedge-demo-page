<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">APA weekly context and Momentum sell activation</title><desc id="desc">Friday closes below APA Trough. An intraday high between Momentum Trough and Momentum SPT creates an alert. A cross below Momentum Trough activates a sell watch toward three Momentum downside targets.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a2b3a"/><stop offset="1" stop-color="#0b1b2b"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f28d8e"/></marker></defs><rect width="720" height="430" rx="16" fill="url(#bg)"/><text x="30" y="37" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">SELL · APA FRIDAY CLOSE + MOMENTUM TRIGGER</text><rect x="30" y="52" width="650" height="42" rx="8" fill="#3a2c3c"/><text x="44" y="78" fill="#f4d495" font-family="Arial,sans-serif" font-size="15">APA: Friday close below APA Trough</text><rect x="36" y="169" width="480" height="67" rx="8" fill="#f28d8e" opacity=".12"/><g stroke-width="2" stroke-dasharray="6 5"><path d="M36 125H514" stroke="#e3ac77"/><path d="M36 169H514" stroke="#7bc5c6"/><path d="M36 236H514M36 280H514M36 311H514M36 341H514" stroke="#f28d8e"/></g><g fill="#e6f4f3" font-family="Arial,sans-serif" font-size="15" font-weight="bold"><text x="530" y="130">APA TROUGH*</text><text x="530" y="174">MOM SPT</text><text x="530" y="241">MOM TROUGH</text><text x="530" y="285">MOM DN TG1</text><text x="530" y="316">MOM DN TG2</text><text x="530" y="346">MOM DN TG3</text></g><path d="M65 261L115 247L170 209L220 188L269 199L319 223L366 244L408 278L445 311L476 345" stroke="#f28d8e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><circle cx="220" cy="188" r="8" fill="#f3c776"/><circle cx="366" cy="244" r="8" fill="#f28d8e"/><text x="39" y="377" fill="#f8d89b" font-family="Arial,sans-serif" font-size="15" font-weight="bold">HIGH IN MOM TROUGH–SPT: ALERT</text><text x="382" y="377" fill="#ffc8c7" font-family="Arial,sans-serif" font-size="15" font-weight="bold">BREAK MOM TROUGH: ACTIVE</text><text x="39" y="409" fill="#b6cbd1" font-family="Arial,sans-serif" font-size="13">*APA Trough shown for context only; conceptual scale.</text></svg>
