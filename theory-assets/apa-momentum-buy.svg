<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">APA weekly context and Momentum buy activation</title><desc id="desc">Friday close between APA Peak and APA UP1, with Momentum Peak above APA Peak. An intraday low between Momentum SPT and Peak creates an alert. A cross above Momentum Peak activates a buy watch toward three Momentum upside targets.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a2b3a"/><stop offset="1" stop-color="#0b1b2b"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52ddc9"/></marker></defs><rect width="720" height="430" rx="16" fill="url(#bg)"/><text x="30" y="37" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="bold">BUY · APA FRIDAY CLOSE + MOMENTUM TRIGGER</text><rect x="30" y="52" width="650" height="42" rx="8" fill="#133d4b"/><text x="44" y="78" fill="#f4d495" font-family="Arial,sans-serif" font-size="15">APA: Peak &lt; Friday close &lt; UP1 · Momentum Peak &gt; APA Peak</text><rect x="36" y="277" width="480" height="58" rx="8" fill="#5cdfca" opacity=".12"/><g stroke-width="2" stroke-dasharray="6 5"><path d="M36 124H514M36 151H514M36 178H514" stroke="#5cdfca"/><path d="M36 231H514" stroke="#f3c776"/><path d="M36 277H514" stroke="#60c9c5"/><path d="M36 335H514" stroke="#60c9c5"/></g><g fill="#e6f4f3" font-family="Arial,sans-serif" font-size="15" font-weight="bold"><text x="530" y="129">MOM UP TG3</text><text x="530" y="156">MOM UP TG2</text><text x="530" y="183">MOM UP TG1</text><text x="530" y="236">MOM PEAK</text><text x="530" y="282">APA PEAK*</text><text x="530" y="340">MOM SPT</text></g><path d="M65 250L114 271L166 314L216 323L265 296L312 260L355 228L394 207L432 173L472 128" stroke="#5cdfca" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><circle cx="216" cy="323" r="8" fill="#f3c776"/><circle cx="355" cy="228" r="8" fill="#5cdfca"/><text x="39" y="377" fill="#f8d89b" font-family="Arial,sans-serif" font-size="15" font-weight="bold">LOW IN MOM SPT–PEAK: ALERT</text><text x="359" y="377" fill="#a8f3e6" font-family="Arial,sans-serif" font-size="15" font-weight="bold">CROSS MOM PEAK: ACTIVE</text><text x="39" y="409" fill="#b6cbd1" font-family="Arial,sans-serif" font-size="13">*APA Peak shown for ordering only; conceptual scale.</text></svg>
