<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">APA Scenario 3: weekly close inside Peak to Trough range</title><desc id="desc">Peak is the upper boundary and Trough is the lower boundary. A possible downside path runs from Peak toward Trough. A possible recovery path runs from Trough toward SPT, the center level.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0e3041"/><stop offset="1" stop-color="#091b2b"/></linearGradient><marker id="redarrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#f49b98"/></marker><marker id="greenarrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#5edbc9"/></marker></defs><rect width="1120" height="450" rx="18" fill="url(#bg)"/><rect x="30" y="20" width="519" height="38" rx="19" fill="#294558"/><text x="50" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="bold">WEEKLY CLOSE BETWEEN APA PEAK AND TROUGH</text><rect x="40" y="108" width="859" height="237" rx="12" fill="#44bec1" opacity=".07"/><g stroke-width="2" stroke-dasharray="8 6"><path d="M40 107H904" stroke="#ecc06c"/><path d="M40 225H904" stroke="#65bdc8"/><path d="M40 345H904" stroke="#ef8e8c"/></g><g fill="#f0f7f5" font-family="Arial,sans-serif" font-size="19" font-weight="bold"><text x="921" y="114">APA PEAK</text><text x="921" y="232">APA SPT</text><text x="921" y="352">APA TROUGH</text></g><path d="M227 125C260 151 282 180 325 206S368 290 405 330" fill="none" stroke="#f49b98" stroke-width="6" stroke-linecap="round" marker-end="url(#redarrow)"/><path d="M588 325C623 302 654 260 690 228" fill="none" stroke="#5edbc9" stroke-width="6" stroke-linecap="round" marker-end="url(#greenarrow)"/><circle cx="227" cy="107" r="7" fill="#ecc06c"/><circle cx="588" cy="345" r="7" fill="#ef8e8c"/><g fill="#f6cccc" font-family="Arial,sans-serif" font-size="19" font-weight="bold"><text x="93" y="188">DOWNSIDE</text><text x="93" y="213">Peak → Trough</text></g><g fill="#b5f4e8" font-family="Arial,sans-serif" font-size="19" font-weight="bold"><text x="710" y="275">UPSIDE RECOVERY</text><text x="710" y="300">Trough → SPT only</text></g><text x="43" y="412" fill="#aac7d0" font-family="Arial,sans-serif" font-size="15">Conceptual level map · Arrows show possible paths, not guaranteed price movement.</text></svg>
