<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">Cycle Changer extension zones in APA and Momentum</title><desc id="desc">For each system, an upper Cycle Changer level lies above UP3 and may become a reversal area after a fast rise. A lower Cycle Changer lies below DN3 and may become a bounce area after a fast fall. These are possible reactions, not guaranteed.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0d2c3c"/><stop offset="1" stop-color="#081c2c"/></linearGradient><marker id="up" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65dfca"/></marker><marker id="down" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f2a09b"/></marker></defs><rect width="1120" height="500" rx="17" fill="url(#bg)"/><text x="33" y="39" fill="#f4cb82" font-family="Arial,sans-serif" font-size="19" font-weight="bold">CYCLE CHANGER · EXTENSION BEYOND THE THIRD TARGET</text><text x="33" y="65" fill="#bdd6d9" font-family="Arial,sans-serif" font-size="15">The same order applies in APA and Momentum; each system has its own calculated levels.</text><path d="M560 92V455" stroke="#ffffff28" stroke-width="2"/><g font-family="Arial,sans-serif" font-weight="bold"><text x="35" y="111" fill="#a9f2e4" font-size="17">UPPER ZONE · POSSIBLE REVERSAL</text><text x="592" y="111" fill="#ffccc8" font-size="17">LOWER ZONE · POSSIBLE BOUNCE</text></g><g stroke-width="2" stroke-dasharray="8 6"><path d="M42 160H457" stroke="#f4c675"/><path d="M42 228H457M42 298H457M42 366H457" stroke="#65cbbc"/><path d="M597 160H915M597 228H915M597 298H915" stroke="#f2a09b"/><path d="M597 366H915" stroke="#f4c675"/></g><g font-family="Arial,sans-serif" font-size="17" font-weight="bold"><text x="535" text-anchor="end" y="166" fill="#ffdfaa">CYCLE CHANGER</text><text x="535" text-anchor="end" y="234" fill="#c8ede8">UP3</text><text x="535" text-anchor="end" y="304" fill="#c8ede8">UP2</text><text x="535" text-anchor="end" y="372" fill="#c8ede8">UP1</text><text x="928" y="166" fill="#ffd0cc">DN1</text><text x="928" y="234" fill="#ffd0cc">DN2</text><text x="928" y="304" fill="#ffd0cc">DN3</text><text x="928" y="372" fill="#ffdfaa">CYCLE CHANGER</text></g><path d="M94 397L145 360L193 312L239 270L285 231L330 184L359 153" fill="none" stroke="#65dfca" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#up)"/><path d="M367 149C402 144 413 172 410 204" fill="none" stroke="#f2a09b" stroke-width="5" stroke-linecap="round" marker-end="url(#down)"/><path d="M627 130L684 169L730 208L774 250L816 290L862 334L886 373" fill="none" stroke="#f2a09b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#down)"/><path d="M893 377C929 380 942 348 942 329" fill="none" stroke="#65dfca" stroke-width="5" stroke-linecap="round" marker-end="url(#up)"/><g font-family="Arial,sans-serif" font-size="15"><text x="53" y="444" fill="#b4d3d5">Fast rise near upper extension</text><text x="598" y="444" fill="#b4d3d5">Fast fall near lower extension</text></g></svg>
