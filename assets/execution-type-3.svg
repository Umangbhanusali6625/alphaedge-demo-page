<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc"><title id="title">TYPE 3 · TCL-confirmed entry</title><desc id="desc">TCL begins above Participation. Premium moves below Participation while TCL approaches that level. Price forms a smaller swing near Participation and crosses above TCL, which is the entry trigger. The stop is below that local swing low, and risk is measured from the actual entry rather than assuming an entry of 200.</desc><rect width="1160" height="650" rx="18" fill="#081a29"/><rect x="1" y="1" width="1158" height="648" rx="17" fill="none" stroke="#426173"/><g font-family="Arial,sans-serif"><text x="40" y="44" font-size="16" fill="#e8b65f" font-weight="700">AlphaEdgePro · U.O.P THEORY</text><text x="40" y="87" font-size="28" fill="#f4f6f8" font-weight="700">TYPE 3 · TCL-confirmed entry</text><text x="40" y="117" font-size="16" fill="#a8bdc9" font-weight="400">TCL = Trend Confirmation Line · use the line shown by your indicator</text><rect x="805" y="145" width="315" height="412" rx="12" fill="#142a38"/><line x1="75" x2="775" y1="170" y2="170" stroke="#6ca8e6" stroke-width="2"/><text x="85" y="160" font-size="16" fill="#6ca8e6" font-weight="700">SIDE UP 2 · target</text><line x1="75" x2="775" y1="220" y2="220" stroke="#6ca8e6" stroke-width="2"/><text x="85" y="210" font-size="16" fill="#6ca8e6" font-weight="700">SIDE UP 1 · target</text><line x1="75" x2="775" y1="380" y2="380" stroke="#71d9a6" stroke-width="2"/><text x="85" y="370" font-size="16" fill="#71d9a6" font-weight="700">PARTICIPATION · 200</text><path d="M130 245 C245 260 335 300 400 315 S470 345 500 352 S565 360 620 333 S710 270 760 225" fill="none" stroke="#e8b65f" stroke-width="4" stroke-dasharray="9 5"/><path d="M130 210 C195 270 240 330 260 380 S320 450 340 450 S378 375 400 355 S438 397 460 402 S509 374 535 350 S588 302 620 280 S704 198 740 170" fill="none" stroke="#88e6b5" stroke-width="5" stroke-linecap="round"/><line x1="425" x2="710" y1="425" y2="425" stroke="#eb8b92" stroke-width="2" stroke-dasharray="7 5"/><text x="84" y="274" font-size="16" fill="#e8b65f" font-weight="400">TCL starts above Participation</text><text x="504" y="328" font-size="16" fill="#fff" font-weight="700">BUY: price crosses above TCL</text><text x="373" y="472" font-size="16" fill="#a8bdc9" font-weight="400">Small swing low near P</text><text x="480" y="446" font-size="16" fill="#eb8b92" font-weight="400">SL below this swing low</text><circle cx="460" cy="402" r="7" fill="#fff"/><circle cx="535" cy="350" r="7" fill="#fff"/><text x="825" y="181" font-size="16" fill="#d8e6ec" font-weight="400">Sequence</text><text x="825" y="215" font-size="16" fill="#d8e6ec" font-weight="400">TCL initially above P</text><text x="825" y="247" font-size="16" fill="#d8e6ec" font-weight="400">Premium breaks below P</text><text x="825" y="281" font-size="16" fill="#d8e6ec" font-weight="400">TCL moves closer to P</text><text x="825" y="330" font-size="16" fill="#d8e6ec" font-weight="400">Price crosses above TCL</text><text x="825" y="362" font-size="16" fill="#d8e6ec" font-weight="400">Entry after the TCL cross</text><text x="825" y="394" font-size="16" fill="#d8e6ec" font-weight="400">SL below the small swing</text><text x="825" y="426" font-size="16" fill="#d8e6ec" font-weight="400">low near Participation</text><text x="825" y="475" font-size="16" fill="#d8e6ec" font-weight="400">1R = actual entry + risk</text><text x="825" y="523" font-size="16" fill="#d8e6ec" font-weight="400">Confirm the live chart.</text><text x="40" y="598" font-size="16" fill="#a8bdc9" font-weight="400">Price paths are illustrative. Side Up targets use the option’s own live levels.</text><text x="40" y="625" font-size="15" fill="#a8bdc9" font-weight="400">Schematic, not to scale · SL = stop-loss · 1R = the defined entry-to-stop risk</text></g></svg>