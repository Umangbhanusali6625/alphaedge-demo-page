<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc"><title id="title">TYPE 1 · Direct Participation entry</title><desc id="desc">Option premium falls from a high to Participation 200. Direct entry near 200 precedes reclaim confirmation. The initial width-based stop is about 193.33. One path forms a low of 196 and rebounds to 204 and Side Up targets; another continues to the initial stop. The 204 checkpoint is based on the later four-point swing distance, not the original 6.67-point risk.</desc><rect width="1160" height="650" rx="18" fill="#081a29"/><rect x="1" y="1" width="1158" height="648" rx="17" fill="none" stroke="#426173"/><g font-family="Arial,sans-serif"><text x="40" y="44" font-size="16" fill="#e8b65f" font-weight="700">AlphaEdgePro · U.O.P THEORY</text><text x="40" y="87" font-size="28" fill="#f4f6f8" font-weight="700">TYPE 1 · Direct Participation entry</text><text x="40" y="117" font-size="16" fill="#a8bdc9" font-weight="400">Earlier entry · the reclaim has not yet been confirmed</text><rect x="805" y="145" width="315" height="412" rx="12" fill="#142a38"/><line x1="75" x2="775" y1="170" y2="170" stroke="#6ca8e6" stroke-width="2"/><text x="85" y="160" font-size="16" fill="#6ca8e6" font-weight="700">SIDE UP 2 · target</text><line x1="75" x2="775" y1="220" y2="220" stroke="#6ca8e6" stroke-width="2"/><text x="85" y="210" font-size="16" fill="#6ca8e6" font-weight="700">SIDE UP 1 · target</text><line x1="75" x2="775" y1="350" y2="350" stroke="#71d9a6" stroke-width="2"/><text x="85" y="340" font-size="16" fill="#71d9a6" font-weight="700">PARTICIPATION · 200</text><line x1="75" x2="775" y1="470" y2="470" stroke="#eb8b92" stroke-width="2" stroke-dasharray="7 5"/><text x="85" y="460" font-size="16" fill="#eb8b92" font-weight="700">INITIAL SL · approximately 193.33</text><path d="M130 200 C190 230 235 290 280 350 S345 422 380 422 S495 320 560 278 S665 215 740 170" fill="none" stroke="#88e6b5" stroke-width="5" stroke-linecap="round"/><path d="M380 422 C425 440 450 479 490 515" fill="none" stroke="#ef939b" stroke-width="4" stroke-dasharray="8 6"/><circle cx="280" cy="350" r="7" fill="#fff"/><circle cx="380" cy="422" r="7" fill="#fff"/><circle cx="560" cy="278" r="7" fill="#fff"/><text x="250" y="325" font-size="16" fill="#fff" font-weight="700">Buy near 200</text><text x="330" y="452" font-size="16" fill="#fff" font-weight="400">New low · 196</text><text x="555" y="261" font-size="16" fill="#e8b65f" font-weight="700">204 · swing-risk checkpoint</text><text x="498" y="518" font-size="15" fill="#ef939b" font-weight="400">No rebound: SL can hit</text><text x="825" y="181" font-size="16" fill="#d8e6ec" font-weight="400">Initial band calculation</text><text x="825" y="215" font-size="16" fill="#d8e6ec" font-weight="400">P − O = 200 − 180 = 20</text><text x="825" y="247" font-size="16" fill="#d8e6ec" font-weight="400">20 ÷ 3 = 6.67 points</text><text x="825" y="281" font-size="16" fill="#d8e6ec" font-weight="400">200 − 6.67 ≈ 193.33 SL</text><text x="825" y="330" font-size="16" fill="#d8e6ec" font-weight="400">If a new 196 swing forms:</text><text x="825" y="362" font-size="16" fill="#d8e6ec" font-weight="400">200 − 196 = 4 points</text><text x="825" y="394" font-size="16" fill="#d8e6ec" font-weight="400">204 = +4-point checkpoint</text><text x="825" y="440" font-size="16" fill="#d8e6ec" font-weight="400">Original-risk 1R ≈ 206.67</text><text x="825" y="491" font-size="16" fill="#d8e6ec" font-weight="400">A break can keep falling.</text><text x="825" y="523" font-size="16" fill="#d8e6ec" font-weight="400">Plan the stop before entry.</text><text x="40" y="598" font-size="16" fill="#a8bdc9" font-weight="400">Price paths are illustrative. Side Up targets use the option’s own live levels.</text><text x="40" y="625" font-size="15" fill="#a8bdc9" font-weight="400">Schematic, not to scale · SL = stop-loss · 1R = the defined entry-to-stop risk</text></g></svg>