<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc"><title id="title">TYPE 2 · Participation reclaim entry</title><desc id="desc">Premium breaks below Participation 200, makes a swing low at 196, and returns above Participation before entry. Stop goes below the observed swing low. Without a stop buffer or costs the four-point distance gives a 204 reward checkpoint; the exact one-risk target changes with actual entry and stop.</desc><rect width="1160" height="650" rx="18" fill="#081a29"/><rect x="1" y="1" width="1158" height="648" rx="17" fill="none" stroke="#426173"/><g font-family="Arial,sans-serif"><text x="40" y="44" font-size="16" fill="#e8b65f" font-weight="700">AlphaEdgePro · U.O.P THEORY</text><text x="40" y="87" font-size="28" fill="#f4f6f8" font-weight="700">TYPE 2 · Participation reclaim entry</text><text x="40" y="117" font-size="16" fill="#a8bdc9" font-weight="400">Wait for the dip, then a move back above Participation</text><rect x="805" y="145" width="315" height="412" rx="12" fill="#142a38"/><line x1="75" x2="775" y1="170" y2="170" stroke="#6ca8e6" stroke-width="2"/><text x="85" y="160" font-size="16" fill="#6ca8e6" font-weight="700">SIDE UP 2 · target</text><line x1="75" x2="775" y1="220" y2="220" stroke="#6ca8e6" stroke-width="2"/><text x="85" y="210" font-size="16" fill="#6ca8e6" font-weight="700">SIDE UP 1 · target</text><line x1="75" x2="775" y1="350" y2="350" stroke="#71d9a6" stroke-width="2"/><text x="85" y="340" font-size="16" fill="#71d9a6" font-weight="700">PARTICIPATION · 200</text><line x1="75" x2="775" y1="438" y2="438" stroke="#eb8b92" stroke-width="2" stroke-dasharray="7 5"/><text x="85" y="428" font-size="16" fill="#eb8b92" font-weight="700">SL BELOW THE 196 SWING LOW</text><path d="M130 210 C190 250 220 300 250 350 S310 422 360 422 S440 390 480 350 S560 300 600 278 S670 210 740 170" fill="none" stroke="#88e6b5" stroke-width="5" stroke-linecap="round"/><circle cx="360" cy="422" r="7" fill="#fff"/><circle cx="480" cy="350" r="7" fill="#fff"/><circle cx="600" cy="278" r="7" fill="#fff"/><text x="110" y="310" font-size="16" fill="#a8bdc9" font-weight="400">Break below P · wait</text><text x="320" y="412" font-size="16" fill="#fff" font-weight="400">Low · 196</text><text x="470" y="335" font-size="16" fill="#fff" font-weight="700">Reclaim · entry near 200</text><text x="577" y="261" font-size="16" fill="#e8b65f" font-weight="700">204 · simplified 1R</text><text x="825" y="181" font-size="16" fill="#d8e6ec" font-weight="400">Sequence</text><text x="825" y="215" font-size="16" fill="#d8e6ec" font-weight="400">200 breaks → low at 196</text><text x="825" y="247" font-size="16" fill="#d8e6ec" font-weight="400">Premium reclaims 200</text><text x="825" y="281" font-size="16" fill="#d8e6ec" font-weight="400">Entry on the reclaim</text><text x="825" y="330" font-size="16" fill="#d8e6ec" font-weight="400">SL below the swing low</text><text x="825" y="362" font-size="16" fill="#d8e6ec" font-weight="400">Nominal risk: 200 − 196 = 4</text><text x="825" y="394" font-size="16" fill="#d8e6ec" font-weight="400">Nominal 1R: 200 + 4 = 204</text><text x="825" y="440" font-size="16" fill="#d8e6ec" font-weight="400">A stop buffer changes 1R.</text><text x="825" y="491" font-size="16" fill="#d8e6ec" font-weight="400">Next: Side Up 1, Side Up 2</text><text x="825" y="523" font-size="16" fill="#d8e6ec" font-weight="400">Reclaim can still fail.</text><text x="40" y="598" font-size="16" fill="#a8bdc9" font-weight="400">Price paths are illustrative. Side Up targets use the option’s own live levels.</text><text x="40" y="625" font-size="15" fill="#a8bdc9" font-weight="400">Schematic, not to scale · SL = stop-loss · 1R = the defined entry-to-stop risk</text></g></svg>