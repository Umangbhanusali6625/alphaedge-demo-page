<title id="title">24050 CE first morning premium move</title>
<desc id="desc">Illustrative premium path. Low between Optimal 170.74 and Participation 197.88, then Participation 197.88 to Side Up 1 225.01, Side Up 2 237.58, a spike to Side Up 3 250.14, and a pullback to an illustrative Trend Confirmation Line near 234. Main upside targets are not shown.</desc>
