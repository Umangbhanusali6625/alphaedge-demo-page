<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
<title id="title">U.O.P weekly selection rhythm</title>
<desc id="desc">Wednesday, Thursday, Friday are the method's preferred setup and observation days. Monday uses the U.O.P extension and starts the last two trading sessions before Tuesday expiry. Tuesday is NIFTY weekly expiry and the method considers a defined-risk option premium selling plan. No day guarantees safety.</desc>
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#112b3b"/></linearGradient></defs>
<rect width="1160" height="500" rx="24" fill="url(#back)"/><rect x="1" y="1" width="1158" height="498" rx="23" fill="none" stroke="#456273"/>
<text x="38" y="53" fill="#eebd6c" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">AlphaEdgePro · U.O.P THEORY</text>
<text x="38" y="95" fill="#f6f4ed" font-family="Arial,sans-serif" font-size="31" font-weight="700">Select the day before selecting the trade</text>
<text x="38" y="126" fill="#b9cbd3" font-family="Arial,sans-serif" font-size="16">Weekly NIFTY option framework · Wednesday → Tuesday expiry</text>
<g font-family="Arial,sans-serif">
<rect x="38" y="160" width="210" height="210" rx="17" fill="#18372f" stroke="#5dc787" stroke-width="2"/><text x="56" y="201" fill="#8de1ab" font-size="15" font-weight="700">PREFERRED SETUP DAY</text><text x="56" y="253" fill="#fff" font-size="27" font-weight="700">WED</text><text x="56" y="294" fill="#d1e8d8" font-size="18">Observe P–O low</text><text x="56" y="324" fill="#d1e8d8" font-size="18">and premium move</text>
<rect x="258" y="160" width="210" height="210" rx="17" fill="#18372f" stroke="#5dc787" stroke-width="2"/><text x="276" y="201" fill="#8de1ab" font-size="15" font-weight="700">PREFERRED SETUP DAY</text><text x="276" y="253" fill="#fff" font-size="27" font-weight="700">THU</text><text x="276" y="294" fill="#d1e8d8" font-size="18">Check strike and</text><text x="276" y="324" fill="#d1e8d8" font-size="18">CE / PE alignment</text>
<rect x="478" y="160" width="210" height="210" rx="17" fill="#18372f" stroke="#5dc787" stroke-width="2"/><text x="496" y="201" fill="#8de1ab" font-size="15" font-weight="700">PREFERRED SETUP DAY</text><text x="496" y="253" fill="#fff" font-size="27" font-weight="700">FRI</text><text x="496" y="294" fill="#d1e8d8" font-size="18">Confirm price</text><text x="496" y="324" fill="#d1e8d8" font-size="18">and TCL behaviour</text>
<rect x="704" y="160" width="210" height="210" rx="17" fill="#3a3222" stroke="#e3b663" stroke-width="2"/><text x="722" y="201" fill="#f5cf81" font-size="15" font-weight="700">EXTENSION DAY</text><text x="722" y="253" fill="#fff" font-size="27" font-weight="700">MON</text><text x="722" y="294" fill="#f0dfbd" font-size="18">Final two-session</text><text x="722" y="324" fill="#f0dfbd" font-size="18">decay window begins</text>
<rect x="924" y="160" width="198" height="210" rx="17" fill="#3c2528" stroke="#eb8c83" stroke-width="2"/><text x="942" y="201" fill="#ffaaa1" font-size="15" font-weight="700">EXPIRY DAY*</text><text x="942" y="253" fill="#fff" font-size="27" font-weight="700">TUE</text><text x="942" y="294" fill="#f1d4d3" font-size="18">Defined-risk</text><text x="942" y="324" fill="#f1d4d3" font-size="18">premium-selling plan</text>
</g>
<path d="M43 402H1113" stroke="#617584" stroke-width="1"/><text x="43" y="434" fill="#f3bd68" font-family="Arial,sans-serif" font-size="18" font-weight="700">DAY  →  STRIKE  →  CE OR PE  →  PRICE &amp; TCL CONFIRMATION</text>
<text x="43" y="466" fill="#aebfca" font-family="Arial,sans-serif" font-size="14">*Tuesday expiry moves to the previous trading day when Tuesday is an exchange holiday. No day or option strategy is inherently safe.</text>
</svg>
