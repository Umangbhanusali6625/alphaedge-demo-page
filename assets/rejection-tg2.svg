<title id="title">CE premium rejection from MAIN UP TG 2 at 341.48</title>
<desc id="desc">Teaching illustration. Premium rises above Side Up 3 with TCL confirmation, passes any earlier main targets, touches MAIN UP TG 2 at 341.48, then pulls back. The TCL is illustrative and a target touch does not confirm a reversal.</desc>
