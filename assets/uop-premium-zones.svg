<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">The U.O.P premium-zone ladder</title><desc id="desc">A premium roadmap arranged from Main Down 3, 2, 1 at the lower end through Side Down, Participation, and Side Up to Main Up 1, 2, 3 at the upper end. U.O.P calls the upper Main Up region Deep ITM zone and the lower Main Down region OTM zone. These course labels do not determine contractual moneyness.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071625"/><stop offset="1" stop-color="#0c2940"/></linearGradient></defs><rect width="1100" height="650" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1098" height="648" rx="21" fill="none" stroke="#486374"/><g font-family="Arial,sans-serif"><text x="42" y="54" fill="#f2bd66" font-size="17" font-weight="700" letter-spacing="3">AlphaEdgePro · U.O.P THEORY</text><text x="42" y="96" fill="#f5f4ee" font-size="29" font-weight="700">The U.O.P premium-zone ladder</text><text x="42" y="126" fill="#a8bdc9" font-size="16">One option premium · higher at the top, lower at the bottom</text></g>
<g font-family="Arial,sans-serif" font-weight="700">
<rect x="43" y="155" width="1014" height="145" rx="15" fill="#1b3e3c" stroke="#75cd96"/><text x="65" y="188" fill="#aaf0bb" font-size="19">U.O.P “DEEP ITM” ZONE · MAIN UPSIDE TARGETS</text>
<line x1="395" x2="920" y1="211" y2="211" stroke="#78d39a" stroke-width="2"/><text x="423" y="202" fill="#e4f6e8" font-size="16">MAIN UP TG 3</text><line x1="395" x2="920" y1="241" y2="241" stroke="#78d39a" stroke-width="2"/><text x="423" y="232" fill="#e4f6e8" font-size="16">MAIN UP TG 2 · REJECTION WATCH</text><line x1="395" x2="920" y1="270" y2="270" stroke="#78d39a" stroke-width="2"/><text x="423" y="261" fill="#e4f6e8" font-size="16">MAIN UP TG 1</text>
<rect x="43" y="310" width="1014" height="135" rx="15" fill="#19344b" stroke="#65bce4"/><text x="65" y="342" fill="#a9e0f3" font-size="18">MIDDLE ROADMAP · REASSESS AT EACH STEP</text><text x="396" y="373" fill="#ecf6fa" font-size="17">SIDE UP 1 / 2 / 3</text><text x="396" y="404" fill="#f4d799" font-size="17">PARTICIPATION + TCL</text><text x="396" y="433" fill="#ecf6fa" font-size="17">SIDE DOWN 1 / 2 / 3</text>
<rect x="43" y="455" width="1014" height="145" rx="15" fill="#382b37" stroke="#d48994"/><text x="65" y="488" fill="#ffb7c0" font-size="19">U.O.P “OTM” ZONE · MAIN DOWNSIDE TARGETS</text><line x1="395" x2="920" y1="509" y2="509" stroke="#e5949d" stroke-width="2"/><text x="423" y="502" fill="#fce6e8" font-size="16">MAIN DOWN TG 1</text><line x1="395" x2="920" y1="539" y2="539" stroke="#e5949d" stroke-width="2"/><text x="423" y="532" fill="#fce6e8" font-size="16">MAIN DOWN TG 2 · REJECTION / BOUNCE WATCH</text><line x1="395" x2="920" y1="569" y2="569" stroke="#e5949d" stroke-width="2"/><text x="423" y="562" fill="#fce6e8" font-size="16">MAIN DOWN TG 3 · DECAY EXTENSION</text>
<text x="43" y="630" fill="#b8cbd3" font-size="15" font-weight="400">Zone names describe this U.O.P premium map; actual ITM / ATM / OTM depends on NIFTY spot versus the strike.</text>
</g></svg>