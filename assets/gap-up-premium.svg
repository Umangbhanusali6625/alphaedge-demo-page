<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Gap-up opening: CE and PE premium reaction</title><desc id="desc">Illustration of a gap-up in NIFTY spot. Call premium often rises while put premium often falls, but volatility, time value, and strike choice can alter either result.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071625"/><stop offset="1" stop-color="#0c2940"/></linearGradient></defs><rect width="1100" height="570" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1098" height="568" rx="21" fill="none" stroke="#486374"/><g font-family="Arial,sans-serif"><text x="42" y="54" fill="#f2bd66" font-size="17" font-weight="700" letter-spacing="3">AlphaEdgePro · U.O.P THEORY</text><text x="42" y="96" fill="#f5f4ee" font-size="29" font-weight="700">Gap-up opening: CE and PE premium reaction</text><text x="42" y="126" fill="#a8bdc9" font-size="16">Three aligned paths · schematic, not historical prices</text></g>
<g font-family="Arial,sans-serif">
<rect x="42" y="163" width="1016" height="100" rx="13" fill="#132c3d" stroke="#3d6172"/><text x="64" y="197" fill="#c7d6db" font-size="17" font-weight="700">NIFTY SPOT</text><path d="M270 229H470 L492 187 H718 Q816 174 1002 175" fill="none" stroke="#f2bd66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="492" cy="187" r="7" fill="#f2bd66"/><text x="542" y="240" fill="#f2bd66" font-size="16">Gap up at open</text>
<rect x="42" y="280" width="1016" height="100" rx="13" fill="#122e32" stroke="#3f7668"/><text x="64" y="315" fill="#a3e9bd" font-size="17" font-weight="700">CE PREMIUM</text><path d="M270 350H472 L498 308 Q665 291 830 295 T1002 287" fill="none" stroke="#79d49c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="764" y="352" fill="#a3e9bd" font-size="16">Often rises</text>
<rect x="42" y="397" width="1016" height="100" rx="13" fill="#302b36" stroke="#806477"/><text x="64" y="432" fill="#ffc1bd" font-size="17" font-weight="700">PE PREMIUM</text><path d="M270 428H472 L500 466 Q630 481 790 473 T1002 482" fill="none" stroke="#f09991" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="769" y="451" fill="#ffc1bd" font-size="16">Often falls</text>
<text x="42" y="542" fill="#b8cbd3" font-size="15">Direction is typical, never certain: implied volatility, time remaining and liquidity also change premium.</text></g></svg>