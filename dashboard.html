<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Theme Pre-hydration Script to eliminate flash -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('alphaedge_theme') || 'dark';
        document.documentElement.dataset.theme = saved;
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>
  <!-- Link custom theme & animation styles -->
  <link rel="stylesheet" href="./css/react-bits-styles.css?v=3.4">
  <meta name="theme-color" content="#061f50">
  <meta name="description" content="APA + Momentum Dashboard - AlphaEdge Pro. Live market levels including APA Fix, APA Extension and Momentum indicators.">
  <title>APA + Momentum Dashboard · ALPHAEDGEPRO</title>
  <link rel="icon" type="image/png" href="./image/Glossy Blue Analytics Head Logo.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", sans-serif;
      background: var(--bg, #03060a);
      color: var(--text, #e2e8f0);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: var(--surf, #070d18);
      border-bottom: 1px solid var(--line, rgba(255,255,255,0.07));
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand-text strong {
      font-size: 13px; font-weight: 800; letter-spacing: 0.06em;
      background: linear-gradient(90deg, #fff, #f3c578);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text span { font-size: 9px; letter-spacing: 0.15em; color: #35d1c4; text-transform: uppercase; }
    .topbar-center {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text, #fff);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #35d1c4; box-shadow: 0 0 8px #35d1c4;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.3); }
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px; text-decoration: none;
      color: var(--mute, #94a3b8); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; transition: color 0.2s;
    }
    .back-btn:hover { color: var(--gold, #f3c578); }
    #dashboard-frame { flex: 1; width: 100%; border: none; background: #061220; display: block; }
    #fallback {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; padding: 40px 20px; text-align: center;
    }
    #fallback.visible { display: flex; }
    .fallback-icon { font-size: 56px; opacity: 0.3; }
    .fallback-title { font-size: 22px; font-weight: 800; color: #fff; }
    .fallback-sub { font-size: 14px; color: #64748b; max-width: 420px; line-height: 1.6; }
    .open-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #07242c, #0b3844);
      border: 1px solid rgba(53,209,196,0.5); border-radius: 6px;
      color: #fff; font-size: 13px; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none; transition: all 0.3s;
      box-shadow: 0 0 20px rgba(53,209,196,0.25);
    }
    .open-btn:hover { box-shadow: 0 0 35px rgba(53,209,196,0.55); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="brand">
      <img src="./image/Glossy Blue Analytics Head Logo.png" alt="AlphaEdge logo">
      <div class="brand-text">
        <strong>ALPHAEDGEPRO</strong>
        <span>Market Intelligence</span>
      </div>
    </a>
    <div class="topbar-center">
      <span class="live-dot"></span>
      APA + Momentum Dashboard
    </div>
    <div class="topbar-right">
      <a href="index.html" class="back-btn">&#8592; Back to Home</a>
      <button class="tb ae-theme-toggle" id="theme" aria-label="Toggle theme" title="Toggle Light / Dark Theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon theme-icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>
  </div>

  <iframe
    id="dashboard-frame"
    src="https://tradevisor-apa-dashboard.abc2317.chatgpt.site/"
    title="APA + Momentum Dashboard"
    allowfullscreen
    loading="lazy"
  ></iframe>

  <div id="fallback">
    <div class="fallback-icon">&#128202;</div>
    <div class="fallback-title">Dashboard Blocked by Browser</div>
    <div class="fallback-sub">
      The dashboard could not be embedded due to browser security policies.<br>
      Click below to open it directly.
    </div>
    <a href="https://tradevisor-apa-dashboard.abc2317.chatgpt.site/" target="_blank" rel="noopener noreferrer" class="open-btn">
      &#128202; Open Dashboard
    </a>
  </div>

  <script>
    const frame = document.getElementById("dashboard-frame");
    const fallback = document.getElementById("fallback");
    let loaded = false;
    frame.addEventListener("load", function() { loaded = true; });
    setTimeout(function() {
      if (!loaded) {
        frame.style.display = "none";
        fallback.classList.add("visible");
      }
    }, 8000);
  </script>
  <script src="./js/react-bits.js?v=3.4"></script>
</body>
</html>
