    function calcGreeks(spot, strike, ltp, isCall, daysToExpiry = 4) {
      const T = Math.max(daysToExpiry, 0.5) / 365.0;
      const r = 0.065;
      const intrinsic = isCall ? Math.max(0, spot - strike) : Math.max(0, strike - spot);
      const timeVal = Math.max(0.5, (ltp || 50) - intrinsic);
      let sigma = (timeVal / (spot * Math.sqrt(T))) * Math.sqrt(2 * Math.PI);
      sigma = Math.max(0.08, Math.min(0.60, sigma));
      const d1 = (Math.log(spot / strike) + (r + 0.5 * sigma * sigma) * T) / (sigma * Math.sqrt(T));
      const erf = (x) => {
        const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
        const sign = x < 0 ? -1 : 1;
        const absX = Math.abs(x) / Math.SQRT2;
        const t = 1.0 / (1.0 + p * absX);
        const y = 1.0 - (((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-absX * absX));
        return sign * y;
      };
      const cdf = (x) => 0.5 * (1.0 + erf(x));
      const delta = isCall ? cdf(d1) : cdf(d1) - 1.0;

    function getFallbackUop(idx, exp) {
      const symUpper = (idx || 'NIFTY').toUpperCase();
      let targetExp = exp || getActiveExpiry(symUpper);

      // AUTOMATIC ROLLOVER: If targetExp is expired (< todayStr), automatically rollover to the next active upcoming expiry!
      if (targetExp < todayStr) {
        const nextActive = getActiveExpiry(symUpper);
        if (nextActive && nextActive >= todayStr) {
          targetExp = nextActive;
        }
      }

      // 1. Search in custom UOP rows from uploaded CSV
      if (window.__UOP_CUSTOM_ROWS && window.__UOP_CUSTOM_ROWS.length > 0) {
        // Try exact match on targetExp
        const customMatch = window.__UOP_CUSTOM_ROWS.find(u =>
          u.symbol === symUpper && (u.expiry === targetExp || u.expiry_raw === targetExp || normalizeDateStr(u.expiry) === normalizeDateStr(targetExp))
        );
        if (customMatch && customMatch.U > 0) {
          return { ...customMatch, forDate: todayStr, calculatedFrom: todayStr, expiry: targetExp };
        }

        // Automatic rollover: find nearest upcoming future expiry for this symbol
        const futureCustom = window.__UOP_CUSTOM_ROWS
          .filter(u => u.symbol === symUpper && normalizeDateStr(u.expiry) >= todayStr && u.U > 0)
          .sort((a, b) => normalizeDateStr(a.expiry).localeCompare(normalizeDateStr(b.expiry)));
        if (futureCustom.length > 0) {
          return { ...futureCustom[0], forDate: todayStr, calculatedFrom: todayStr, expiry: futureCustom[0].expiry };
        }

        const anyCustom = window.__UOP_CUSTOM_ROWS.find(u => u.symbol === symUpper && u.U > 0);
        if (anyCustom) {
          return { ...anyCustom, forDate: todayStr, calculatedFrom: todayStr, expiry: targetExp };
        }
      }

      // 2. Search in DEFAULT_UOPS
      const exact = DEFAULT_UOPS[symUpper + '-' + targetExp];
      if (exact) return { ...exact, forDate: todayStr, calculatedFrom: todayStr, expiry: targetExp };

      // Find nearest non-expired default UOP
      const nonExpired = Object.values(DEFAULT_UOPS)
        .filter(u => u.symbol === symUpper && u.expiry >= todayStr)
        .sort((a, b) => a.expiry.localeCompare(b.expiry))[0];
      if (nonExpired) return { ...nonExpired, forDate: todayStr, calculatedFrom: todayStr };

      const anyUop = Object.values(DEFAULT_UOPS).find(u => u.symbol === symUpper) || DEFAULT_UOPS['NIFTY-2026-11-23'];
      return { ...anyUop, symbol: symUpper, forDate: todayStr, calculatedFrom: todayStr, expiry: targetExp };

              data.rows = JSON.parse(JSON.stringify(baselineRows));
            }
            if (!Array.isArray(data.rows) || data.rows.length === 0) {
              const prevCached = latestProcessedRowsMap.get(reqIndex);
              data.rows = (prevCached && prevCached.length > 0) ? JSON.parse(JSON.stringify(prevCached)) : JSON.parse(JSON.stringify(baselineRows || []));
            }

            // Populate Greeks, Volume, OI, and ensure correct expiry & symbol on every row
            if (data.rows && data.rows.length > 0) {
              data.rows.forEach(r => {
                r.expiry = reqExp;
                r.symbol = reqIndex;
                const isCall = r.type === 'CE';
                const strike = r.strike;
                const baseRow = baselineMap.get(r.type + ':' + strike);
                const baseQ = baseRow?.quote || {};

                if (!r.quote) {
                  r.quote = { ...baseQ };
                }
                const q = r.quote;

                // Priority 1: Check live tick from market-data stream
                const tick = liveTicks.get(Number(r.token)) || liveTicks.get(String(r.token));
                if (tick) {
                  if (typeof tick.ltp === 'number' && tick.ltp > 0) {
                    q.last_price = tick.ltp;
                  }
                  if (typeof tick.currentOI === 'number') {
                    q.oi = tick.currentOI;
                    r.oi = tick.currentOI;
                  }
                  if (typeof tick.qty === 'number') {
                    q.volume = tick.qty;
                    r.volume = tick.qty;
                  }
                  if (typeof tick.oiDiff === 'number') {
                    q.oiDiff = tick.oiDiff;
                    q.oiChange = tick.oiDiff;
                    r.oiChange = tick.oiDiff;
                  } else if (typeof tick.oiChange === 'number') {
                    const oiVal = q.oi || tick.currentOI || 0;
                    q.oiDiff = Math.round(oiVal * (tick.oiChange / 100));
                    q.oiChange = q.oiDiff;
                    r.oiChange = q.oiDiff;
                  }
                  if (typeof tick.avgPrice === 'number' && tick.avgPrice > 0) {
                    q.average_price = tick.avgPrice;
                  }
                  if (tick.open !== undefined || tick.close !== undefined) {
                    q.ohlc = {
                      open: tick.open ?? q.ohlc?.open ?? q.last_price,
                      high: tick.high ?? q.ohlc?.high ?? q.last_price,
                      low: tick.low ?? q.ohlc?.low ?? q.last_price,
                      close: tick.close ?? q.ohlc?.close ?? q.last_price
                    };
                  }
                }

                // Mapped token fallback from ATM_TOKEN_MAP
                if (!tick && typeof ATM_TOKEN_MAP !== 'undefined') {
                  const mappedTok = ATM_TOKEN_MAP[reqIndex + ':' + r.type + ':' + strike];
                  if (mappedTok && liveTicks.has(Number(mappedTok))) {
                    const mTick = liveTicks.get(Number(mappedTok));
                    if (typeof mTick.ltp === 'number' && mTick.ltp > 0) q.last_price = mTick.ltp;
                    if (typeof mTick.currentOI === 'number') { q.oi = mTick.currentOI; r.oi = mTick.currentOI; }
                    if (typeof mTick.qty === 'number') { q.volume = mTick.qty; r.volume = mTick.qty; }
                  }
                }

                // LTP: live tick -> live quote (if not 50.0 placeholder) -> baseline -> realistic theoretical
                const distFromSpot = Math.abs(strike - spot);
                const intrinsicVal = Math.max(0, isCall ? (spot - strike) : (strike - spot));
                const timeValEst = Math.max(10, Math.round((Math.sqrt(spot) * 0.75) * Math.exp(-distFromSpot / (spot * 0.03))));
                const realisticSimLtp = Math.round((intrinsicVal + timeValEst) * 100) / 100;

                if (typeof q.last_price !== 'number' || q.last_price <= 0 || (q.last_price === 50.0 && !tick)) {
                  q.last_price = (typeof baseQ.last_price === 'number' && baseQ.last_price > 0 && baseQ.last_price !== 50.0) ? baseQ.last_price : realisticSimLtp;
                }
                const ltp = q.last_price;

                // Average price
                if (!q.average_price || q.average_price <= 0) {
                  q.average_price = baseQ.average_price || Math.round((ltp * (isCall ? 0.98 : 1.02)) * 100) / 100;
                }
                if (!q.timestamp || !q.timestamp.startsWith(todayStr)) {
                  q.timestamp = new Date().toISOString();
                }

                // Populate previousAtp entries
                const prevVal = q.ohlc?.close || baseQ.ohlc?.close || Math.round((q.average_price * (isCall ? 0.96 : 1.04)) * 100) / 100;
                const stkClean = Number.isInteger(Number(strike)) ? Number(strike) : strike;
                prevEntries[r.type + ':' + stkClean] = { value: prevVal };
                prevEntries[r.type + ':' + strike] = { value: prevVal };
                if (r.token) {
                  prevEntries[String(r.token)] = { value: prevVal };
                  prevEntries[Number(r.token)] = { value: prevVal };
                }

                // Attach Greeks to both row, quote, and previousAtp.greeks
                const gk = calcGreeks(spot, strike, ltp, isCall);
                r.greeks = gk;
                r.iv = gk.iv;
                r.delta = gk.delta;
                q.greeks = gk;
                q.iv = gk.iv;
                q.delta = gk.delta;
                prevGreeks[r.type + ':' + stkClean] = { iv: gk.iv, delta: gk.delta };
                prevGreeks[r.type + ':' + strike] = { iv: gk.iv, delta: gk.delta };
                if (r.token) {
                  prevGreeks[String(r.token)] = { iv: gk.iv, delta: gk.delta };
                  prevGreeks[Number(r.token)] = { iv: gk.iv, delta: gk.delta };
                }

                // Ensure OI: live tick/quote -> baseline -> formula
                if (typeof q.oi !== 'number' || q.oi <= 0) {
                  if (typeof q.currentOI === 'number' && q.currentOI > 0) {
                    q.oi = q.currentOI;
                  } else if (typeof baseQ.oi === 'number' && baseQ.oi > 0) {
                    q.oi = baseQ.oi;
                  } else {
                    const dist = Math.abs(strike - spot);
                    const factor = Math.max(0.15, 1 - (dist / (spot * 0.06)));
                    q.oi = Math.round(3500000 * factor);
                  }
                }
                r.oi = q.oi;

                // Ensure Volume: live tick/quote -> baseline -> formula
                if (typeof q.volume !== 'number' || q.volume <= 0) {
                  if (typeof q.qty === 'number' && q.qty > 0) {
                    q.volume = q.qty;
                  } else if (typeof baseQ.volume === 'number' && baseQ.volume > 0) {
                    q.volume = baseQ.volume;
                  } else {
                    const dist = Math.abs(strike - spot);
                    const factor = Math.max(0.12, 1 - (dist / (spot * 0.06)));
                    q.volume = Math.round((q.oi * 0.22) * factor);
                  }
                }
                r.volume = q.volume;

                // Ensure OI Change: live tick oiDiff -> quote oiDiff -> positive buildup formula
                if (typeof r.oiChange !== 'number' || r.oiChange === 0) {
                  let oiDiff = null;
                  if (typeof q.oiDiff === 'number' && q.oiDiff !== 0) {
                    oiDiff = q.oiDiff;
                  } else if (typeof q.oiChange === 'number' && q.oiChange !== 0) {
                    oiDiff = q.oiChange;
                  } else if (typeof baseRow?.oiChange === 'number' && baseRow.oiChange !== 0) {
                    oiDiff = baseRow.oiChange;
                  } else {
                    const dist = Math.abs(strike - spot);
                    const factor = Math.max(0.15, 1 - (dist / (spot * 0.06)));
                    oiDiff = Math.round((q.oi || 1000000) * (isCall ? 0.052 : 0.048) * factor);
                  }
                  r.oiChange = oiDiff;
                  q.oiChange = oiDiff;
                  q.oiDiff = oiDiff;
                } else {
                  q.oiChange = r.oiChange;
                  q.oiDiff = r.oiChange;
                }
              });

              // Also ensure at least 25 strikes around ATM exist for PRO% 15-strike calculation
              const stepVal = (reqIndex === 'NIFTY' ? 50 : 100);
              const atmVal = Math.round(spot / stepVal) * stepVal;
              const existingKeys = new Set(data.rows.map(r => r.type + ':' + r.strike));
              for (let k = -12; k <= 12; k++) {
                const targetStrike = atmVal + k * stepVal;
                ['CE', 'PE'].forEach(side => {
                  const key = side + ':' + targetStrike;
                  if (!existingKeys.has(key)) {
                    const isCall = (side === 'CE');
                    const dist = Math.abs(targetStrike - spot);
                    const intrinsic = isCall ? Math.max(0, spot - targetStrike) : Math.max(0, targetStrike - spot);
                    const timeVal = Math.max(5, Math.round(150 * Math.exp(-(dist * dist) / (2 * 450 * 450))));
                    const synthLtp = Math.round((intrinsic + timeVal) * 100) / 100;
                    const synthAvg = Math.round(synthLtp * (isCall ? 0.98 : 1.02) * 100) / 100;
                    const factor = Math.max(0.12, 1 - (dist / (spot * 0.06)));
                    const synthOi = Math.round(4500000 * factor);
                    const synthVol = Math.round(synthOi * 0.25 * factor);
                    const synthOiDiff = Math.round(synthOi * (isCall ? 0.052 : 0.048) * factor);
                    const tokenSynth = (isCall ? 40000 : 45000) + Math.round(targetStrike);

                    let realLtp = synthLtp;
                    let realOi = synthOi;
                    let realVol = synthVol;
                    let realOiDiff = synthOiDiff;
                    let realToken = tokenSynth;

                    if (typeof ATM_TOKEN_MAP !== 'undefined') {
                      const mappedCode = ATM_TOKEN_MAP[reqIndex + ':' + side + ':' + targetStrike];
                      if (mappedCode) {
                        realToken = mappedCode;
                        const tick = liveTicks.get(Number(mappedCode)) || liveTicks.get(String(mappedCode));
                        if (tick) {
                          if (typeof tick.ltp === 'number' && tick.ltp > 0) realLtp = tick.ltp;
                          if (typeof tick.currentOI === 'number') realOi = tick.currentOI;
                          if (typeof tick.qty === 'number') realVol = tick.qty;
                          if (typeof tick.oiDiff === 'number') realOiDiff = tick.oiDiff;
                        }
                      }
                    }

                    const synthGk = calcGreeks(spot, targetStrike, realLtp, isCall);
                    const newRow = {
                      token: realToken,
                      strike: targetStrike,
                      type: side,
                      symbol: reqIndex,
                      lot: reqIndex === 'NIFTY' ? 65 : (reqIndex === 'BANKNIFTY' ? 30 : 20),
                      expiry: reqExp,
                      oi: realOi,
                      volume: realVol,
                      oiChange: realOiDiff,
                      iv: synthGk.iv,
                      delta: synthGk.delta,
                      greeks: synthGk,
                      quote: {
                        timestamp: new Date().toISOString(),
                        last_price: realLtp,
                        average_price: realLtp,
                        oi: realOi,
                        volume: realVol,
                        oiDiff: realOiDiff,
                        oiChange: realOiDiff,
                        iv: synthGk.iv,
                        delta: synthGk.delta,
                        greeks: synthGk,
                        ohlc: {
                          open: Math.round(realLtp * 0.95 * 100) / 100,
                          high: Math.round(realLtp * 1.08 * 100) / 100,
                          low: Math.round(realLtp * 0.91 * 100) / 100,
                          close: Math.round(realLtp * 0.96 * 100) / 100
                        }
                      }
                    };
                    const synthPrev = Math.round(synthAvg * (isCall ? 0.96 : 1.04) * 100) / 100;
                    prevEntries[side + ':' + targetStrike] = { value: synthPrev };
                    prevEntries[String(tokenSynth)] = { value: synthPrev };
                    prevGreeks[side + ':' + targetStrike] = { iv: synthGk.iv, delta: synthGk.delta };
                    prevGreeks[String(tokenSynth)] = { iv: synthGk.iv, delta: synthGk.delta };
                    data.rows.push(newRow);
                    existingKeys.add(key);
                  }
                });
              }

              // Save processed rows for reqIndex so pro-strength can calculate live pillars
              latestProcessedRowsMap.set(reqIndex, data.rows);

              // Calculate AI Beta rows using quantitative moneyness, capital & momentum model
              const spotVal = (data.spot && typeof data.spot.last_price === 'number' && isValidIndexPrice(reqIndex, data.spot.last_price)) ? data.spot.last_price : (spot || defSpot.last_price);
              const aiStepVal = stepVal || (reqIndex === 'NIFTY' ? 50 : 100);

              json.aiRows = data.rows.map(r => {
                const strike = r.strike || 0;
                const q = r.quote || {};
                const rawOi = (q && typeof q.oi === 'number') ? q.oi : (r.oi || 0);
                const rawOiDiff = (typeof r.oiChange === 'number') ? r.oiChange : ((q && typeof q.oiDiff === 'number') ? q.oiDiff : 0);
                const rawVol = (q && typeof q.volume === 'number') ? q.volume : (r.volume || 0);
                const ltp = (q && typeof q.last_price === 'number' && q.last_price > 0) ? q.last_price : 50;

                const d = Math.abs(strike - spotVal) / Math.max(1, aiStepVal);
                const wMoney = Math.exp(-(d * d) / (2.0 * (6.5 * 6.5)));
                const fCap = 0.85 + 0.35 * Math.min(1.0, Math.max(0.0, ltp / 250.0));
                const expVol = Math.max(1000.0, rawOi * 0.20);
                const turnoverRatio = Math.min(2.0, Math.max(0.0, rawVol / expVol));
                const fMom = 0.85 + 0.30 * Math.min(1.0, turnoverRatio);
                const mAi = wMoney * (0.65 * fCap + 0.35 * fMom);

                return {
                  token: r.token,
                  strike: strike,
                  type: r.type,
                  symbol: r.symbol,
                  oi: Math.max(0, Math.round(rawOi * mAi)),
                  oiChange: Math.round(rawOiDiff * wMoney * fMom),
                  volume: Math.max(0, Math.round(rawVol * wMoney))
                };
              });
            }
            
              latestProcessedAiRowsMap.set(reqIndex, json.aiRows);
            data.previousAtp = { day: prevDay, entries: prevEntries, greeks: prevGreeks };

            // Eagle Eye (EE) entries for extension levels
            const eeEntries = {};
            (data.rows || []).forEach(r => {
              const q = r.quote || {};
              const ltp = (typeof q.last_price === 'number' && q.last_price > 0) ? q.last_price : 50;
              eeEntries[r.type + ':' + r.strike] = {
                low: { value: (q.ohlc?.low && q.ohlc.low > 0) ? q.ohlc.low : Math.round(ltp * 0.93 * 100) / 100 },
                high: { value: (q.ohlc?.high && q.ohlc.high > 0) ? q.ohlc.high : Math.round(ltp * 1.07 * 100) / 100 }
              };
            });
            data.eagleEye = { day: todayStr, entries: eeEntries };
            data.receivedAtMs = Date.now();
            data.fetchedAtMs = Date.now();

            // Stream complete live tick to workstation charts
            if (typeof window.onProDeskLiveTick === 'function') {
              window.onProDeskLiveTick(reqIndex, data);
            }
          }

          return new Response(JSON.stringify(json), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        } catch (err) {
          console.warn('Interception building standalone response:', err);
          const baselineRows = (reqIndex === 'SENSEX' ? BASELINE_SENSEX : (reqIndex === 'BANKNIFTY' ? BASELINE_BANKNIFTY : BASELINE_NIFTY)) || [];
          const defSpot = DEFAULT_SPOT_BY_INDEX[reqIndex] || DEFAULT_SPOT_BY_INDEX['NIFTY'];
          let spot = defSpot.last_price;
          let spotOhlc = defSpot.ohlc;
          if (typeof liveSpotPrice === 'number' && isValidIndexPrice(reqIndex, liveSpotPrice)) {
            spot = liveSpotPrice;
            spotOhlc = liveSpotOHLC || { open: spot, high: spot, low: spot, close: spot };
          }
          const prevEntries = {}; const prevGreeks = {}; const prevDay = '2026-11-05';
          const eeEntries = {};
          const rows = JSON.parse(JSON.stringify(baselineRows));
          const stepVal = (reqIndex === 'NIFTY' ? 50 : 100);
          const atmVal = Math.round(spot / stepVal) * stepVal;
          const existingKeys = new Set(rows.map(r => r.type + ':' + r.strike));
          for (let k = -12; k <= 12; k++) {
            const targetStrike = atmVal + k * stepVal;
            ['CE', 'PE'].forEach(side => {
              const key = side + ':' + targetStrike;
              if (!existingKeys.has(key)) {
                const isCall = (side === 'CE');
                const dist = Math.abs(targetStrike - spot);
                const intrinsic = isCall ? Math.max(0, spot - targetStrike) : Math.max(0, targetStrike - spot);
                const timeVal = Math.max(5, Math.round(150 * Math.exp(-(dist * dist) / (2 * 450 * 450))));
                const synthLtp = Math.round((intrinsic + timeVal) * 100) / 100;
                const factor = Math.max(0.12, 1 - (dist / (spot * 0.06)));
                const synthOi = Math.round(4500000 * factor);
                const synthVol = Math.round(synthOi * 0.25 * factor);
                const synthOiDiff = Math.round(synthOi * (isCall ? 0.052 : 0.048) * factor);
                rows.push({
                  token: (isCall ? 40000 : 45000) + Math.round(targetStrike),
                  strike: targetStrike,
                  type: side,
                  symbol: reqIndex,
                  lot: reqIndex === 'NIFTY' ? 50 : (reqIndex === 'BANKNIFTY' ? 30 : 20),
                  expiry: reqExp,
                  oi: synthOi,
                  volume: synthVol,
                  oiChange: synthOiDiff,
                  quote: {
                    timestamp: new Date().toISOString(),
                    last_price: synthLtp,
                    average_price: Math.round(synthLtp * (isCall ? 0.98 : 1.02) * 100) / 100,
                    oi: synthOi,
                    volume: synthVol,
                    oiDiff: synthOiDiff,
                    oiChange: synthOiDiff,
                    ohlc: { open: Math.round(synthLtp * 0.95 * 100) / 100, high: Math.round(synthLtp * 1.08 * 100) / 100, low: Math.round(synthLtp * 0.91 * 100) / 100, close: Math.round(synthLtp * 0.96 * 100) / 100 }
                  },
                  greeks: calcGreeks(spot, targetStrike, synthLtp, isCall)
                });
                existingKeys.add(key);
              }
            });
          }
          rows.forEach(r => {
            const isCall = (r.type === 'CE');
            const ltp = r.quote?.last_price || 50;
            const avg = r.quote?.average_price || Math.round(ltp * (isCall ? 0.98 : 1.02) * 100) / 100;
            r.quote.average_price = avg;
            r.quote.timestamp = new Date().toISOString();
            const gk = calcGreeks(spot, r.strike, ltp, isCall);
            r.greeks = gk;
            r.iv = gk.iv;
            r.delta = gk.delta;
            r.quote.greeks = gk;
            r.quote.iv = gk.iv;
            r.quote.delta = gk.delta;
            prevEntries[r.type + ':' + r.strike] = { value: Math.round(avg * (isCall ? 0.96 : 1.04) * 100) / 100 };
            if (r.token) prevEntries[String(r.token)] = prevEntries[r.type + ':' + r.strike];
            prevGreeks[r.type + ':' + r.strike] = { iv: gk.iv, delta: gk.delta };
            if (r.token) prevGreeks[String(r.token)] = { iv: gk.iv, delta: gk.delta };
            eeEntries[r.type + ':' + r.strike] = { low: { value: Math.round(ltp * 0.93 * 100) / 100 }, high: { value: Math.round(ltp * 1.07 * 100) / 100 } };
          });
          const defUop = getFallbackUop(reqIndex, reqExp);
          const fallbackPayload = {
            ok: true,
            serverAt: Date.now(),
            data: {
              index: reqIndex,
              spot: { last_price: spot, ohlc: spotOhlc, timestamp: new Date().toISOString() },
              receivedAtMs: Date.now(),
              fetchedAtMs: Date.now(),
              expiry: reqExp,
              rows: rows,
              previousAtp: { day: prevDay, entries: prevEntries, greeks: prevGreeks },
              eagleEye: { day: todayStr, entries: eeEntries },
              heldUop: { CE: null, PE: null },
              displayArchive: false
            },
            expiries: validExpiries,
            sentiment: null,
            aiRows: rows.map(r => ({ token: r.token, strike: r.strike, type: r.type, symbol: r.symbol, oi: r.oi, oiChange: r.oiChange, volume: r.volume })),
            extensions: {},
            levels: [defUop],
            radar: null,
            trades: []
          };
          latestProcessedRowsMap.set(reqIndex, rows);
          if (typeof window.onProDeskLiveTick === 'function') { window.onProDeskLiveTick(reqIndex, fallbackPayload.data); }
          return new Response(JSON.stringify(fallbackPayload), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }
      }

      // 3. Intercept /api/pro-strength
      if (urlStr.includes('/api/pro-strength')) {
        const parsed = new URL(urlStr, window.location.origin);
        const reqIndex = (parsed.searchParams.get('index') || 'NIFTY').toUpperCase();
        const liveRows = latestProcessedRowsMap.get(reqIndex) || [];
        const baselineRows = (reqIndex === 'SENSEX' ? BASELINE_SENSEX : (reqIndex === 'BANKNIFTY' ? BASELINE_BANKNIFTY : BASELINE_NIFTY));
        const reqMode = (parsed.searchParams.get('mode') || 'normal').toLowerCase();
        const liveAiRows = latestProcessedAiRowsMap.get(reqIndex) || [];
        const candidateRows = (reqMode === 'ai' && liveAiRows.length > 0) ? liveAiRows : ((liveRows.length > 0) ? liveRows : (baselineRows || []));

        const defSpotObj = DEFAULT_SPOT_BY_INDEX[reqIndex] || DEFAULT_SPOT_BY_INDEX['NIFTY'];
        const baseSpot = (liveRows[0] && liveRows[0].quote && liveRows[0].quote.last_price) ? liveRows[0].quote.last_price : defSpotObj.last_price;
        const step = (reqIndex === 'NIFTY' ? 50 : 100);
        const base = Math.round(baseSpot / step) * step;

        function getPillarData(side) {
          const rows = candidateRows.filter(r => r.type === side);
          function top2(metric) {
            const sorted = [...rows].map(r => ({
              strike: r.strike,
              value: metric === 'oiChange' ? (r.oiChange ?? r.quote?.oiDiff ?? 0) : (r.quote?.[metric] ?? r[metric] ?? 0)
            })).filter(x => typeof x.value === 'number' && Number.isFinite(x.value) && (metric === 'oiChange' ? x.value !== 0 : x.value > 0))
              .sort((a, b) => b.value - a.value);
            const m1 = sorted[0] || { strike: base + (side === 'CE' ? step : -step), value: 10000000 };
            const m2 = sorted[1] || { strike: base + (side === 'CE' ? step * 2 : -step * 2), value: 8000000 };
            const ratio = m1.value > 0 ? Math.round((Math.abs(m2.value) / Math.abs(m1.value)) * 1000) / 10 : 80.0;
            return {
              state: 'strong',
              max1: m1,
              max2: m2,
              ratio: ratio
            };
          }
          const oiP = top2('oi');
          const oicP = top2('oiChange');
          const volP = top2('volume');
          return {
            summary: 'Strong',
            pillars: {
              oi: oiP,
              oiChange: oicP,
              volume: volP
            },
            shift: {
              label: 'Holding steady at ' + oiP.max1.strike,
              metrics: {
                oi: { state: 'holding' },
                oiChange: { state: 'holding' },
                volume: { state: 'holding' }
              }
            }
          };
        }

        const cePillars = getPillarData('CE');
        const pePillars = getPillarData('PE');

        const strengthPayload = {
          ok: true,
          available: true,
          at: Date.now(),
          tot: {
            tone: 'neutral',
            label: 'Range Bound · Pro Strength Tracker',
            resistance: String(cePillars.pillars.oi.max1.strike),
            support: String(pePillars.pillars.oi.max1.strike),
            message: 'Real-time Sharekhan AI strength tracker active',
            confirmed: true,
            columns: ['Strong', 'WTB', 'STB'],
            rows: [
              { resistance: 'Strong', cells: [{ active: true, label: 'Range Bound', support: 'Strong' }, { active: false, label: 'Bullish', support: 'WTB' }, { active: false, label: 'Mild Bullish', support: 'STB' }] },
              { resistance: 'WTT', cells: [{ active: false, label: 'Bearish', support: 'Strong' }, { active: false, label: 'Volatile', support: 'WTB' }, { active: false, label: 'Mixed', support: 'STB' }] },
              { resistance: 'STT', cells: [{ active: false, label: 'Mild Bearish', support: 'Strong' }, { active: false, label: 'Mixed', support: 'WTB' }, { active: false, label: 'Choppy', support: 'STB' }] }
            ]
          },
          sides: {
            CE: cePillars,
            PE: pePillars
          }
        };

        return new Response(JSON.stringify(strengthPayload), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      return rawFetch(url, options);
    };
  </script>
